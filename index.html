<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .card {
      background: #161b22;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      text-align: center;
      min-width: 280px;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .activity {
      font-size: 0.95rem;
      color: #58a6ff;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      background: gray;
    }

    .online { background: #3fb950; }
    .idle { background: #d29922; }
    .dnd { background: #f85149; }
    .offline { background: #6e7681; }
  </style>
</head>

<body>
  <div class="card">
    <div class="name" id="username">Loading...</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="presence">Fetching status…</span>
    </div>
    <div class="activity" id="activity"></div>
  </div>

  <script>
    const USER_ID = "1364634555977564230";

    async function loadStatus() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/1364634555977564230`);
        const json = await res.json();
        const data = json.data;

        document.getElementById("username").textContent =
          data.discord_user.username;

        const status = data.discord_status;
        const dot = document.getElementById("dot");
        dot.className = "dot " + status;

        document.getElementById("presence").textContent =
          status.charAt(0).toUpperCase() + status.slice(1);

        const activityEl = document.getElementById("activity");

        if (data.activities.length > 0) {
          activityEl.textContent = "Doing: " + data.activities[0].name;
        } else {
          activityEl.textContent = "Not doing anything interesting.";
        }

      } catch (e) {
        document.getElementById("presence").textContent = "Failed to load.";
        console.error(e);
      }
    }

    loadStatus();
    setInterval(loadStatus, 15000); // refresh every 15s
  </script>
</body>
</html>
