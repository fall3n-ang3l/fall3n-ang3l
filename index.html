<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Arya/Autumn Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      min-height: 100vh;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
    }

    header p {
      margin: 0;
      opacity: 0.7;
      font-size: 1rem;
    }

    .card {
      background: #161b22;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      text-align: center;
      margin-top: 40px;
      min-width: 300px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status {
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      background: gray;
      vertical-align: middle;
    }
    .online { background: #3fb950; }
    .idle { background: #d29922; }
    .dnd { background: #f85149; }
    .offline { background: #6e7681; }

    .info {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-top: 10px;
      line-height: 1.4rem;
      text-align: left;
    }

    .activity {
      margin-top: 10px;
      padding: 8px;
      background: #0d1117;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: left;
      border: 1px solid #30363d;
    }

    section {
      margin-top: 40px;
      max-width: 600px;
    }

    section h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 4px;
    }

    .spotify {
      margin-top: 8px;
      font-style: italic;
      color: #1db954;
    }

  </style>
</head>
<body>
  <header>
    <h1>Arya / Autumn</h1>
    <p>Personal Status & Dashboard</p>
  </header>

  <div class="card">
    <img id="avatar" class="avatar" src="" alt="Avatar">
    <div class="name" id="username">Loading...</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="presence">Fetching status…</span>
    </div>

    <div class="info" id="device"></div>
    <div class="activity" id="activities"></div>
  </div>

  <section>
    <h2>Raw Info</h2>
    <pre id="raw" style="background:#0d1117;padding:10px;border-radius:8px;border:1px solid #30363d;overflow-x:auto;font-size:0.85rem;"></pre>
  </section>

  <script>
    const USER_ID = "1364634555977564230";

    async function loadStatus() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`);
        const json = await res.json();
        const data = json.data;

        // Avatar & username
        const avatarEl = document.getElementById("avatar");
        avatarEl.src = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.png`;
        document.getElementById("username").textContent = data.discord_user.username;

        // Status
        const status = data.discord_status;
        const dot = document.getElementById("dot");
        dot.className = "dot " + status;
        document.getElementById("presence").textContent = status.charAt(0).toUpperCase() + status.slice(1);

        // Device info
        const deviceEl = document.getElementById("device");
        let devices = [];
        if(data.active_on_discord_desktop) devices.push("Desktop");
        if(data.active_on_discord_mobile) devices.push("Mobile");
        deviceEl.textContent = devices.length ? "Active on: " + devices.join(", ") : "Not active on any device";

        // Activities
        const activitiesEl = document.getElementById("activities");
        activitiesEl.innerHTML = "";
        if(data.activities.length) {
          data.activities.forEach(act => {
            let activityText = `[${act.type}] ${act.name}`;
            if(act.state) activityText += " - " + act.state;
            if(act.details) activityText += " | " + act.details;
            activitiesEl.innerHTML += `<div>${activityText}</div>`;
          });
        } else {
          activitiesEl.textContent = "No current activities.";
        }

        // Spotify
        if(data.listening_to_spotify && data.spotify) {
          const spotifyEl = document.createElement("div");
          spotifyEl.className = "spotify";
          spotifyEl.textContent = `Listening to ${data.spotify.song} by ${data.spotify.artist}`;
          activitiesEl.appendChild(spotifyEl);
        }

        // Raw JSON for nerd flex
        document.getElementById("raw").textContent = JSON.stringify(data, null, 2);

      } catch(e) {
        console.error(e);
        document.getElementById("presence").textContent = "Failed to load.";
      }
    }

    loadStatus();
    setInterval(loadStatus, 15000); // refresh every 15s
  </script>
</body>
</html>
